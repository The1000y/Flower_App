###############################################################################
# docker-compose.prod.yml — Team 2 Microservices (Production / Mobile)
###############################################################################

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flower_sqlserver_team2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data_team2:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD:-Password123!}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - flower_net_team2

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flower_rabbitmq_team2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - flower_net_team2

  seq:
    image: datalust/seq:latest
    container_name: flower_seq_team2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-Admin123!}
    volumes:
      - seq_data_team2:/data
    ports:
      - "127.0.0.1:5341:80"
    networks:
      - flower_net_team2

  apigateway:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-apigateway-team2:latest
    build:
      context: .
      dockerfile: API Gateway/Dockerfile
    container_name: flower_apigateway_team2
    restart: unless-stopped
    depends_on:
      authservice:
        condition: service_started
      catalogservice:
        condition: service_started
      cartservice:
        condition: service_started
      orderfulfillmentservice:
        condition: service_started
      paymentservice:
        condition: service_started
      addressstorecoverageservice:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "8080:8080"
    networks:
      - flower_net_team2

  authservice:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-identity-service-team2:latest
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    container_name: flower_identity_service_team2
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__AuthDb: "Server=sqlserver,1433;Database=${MSSQL_DB:-AuthDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DB:-AuthDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASS:-guest}
      Jwt__Key: ${JWT_SECRET:-YOUR_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_MIN_32_CHARS}
      Jwt__Issuer: ${JWT_ISSUER:-FlowersAuth}
      Jwt__Audience: ${JWT_AUDIENCE:-FlowersApp}
      JwtSettings__Secret: ${JWT_SECRET:-YOUR_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_MIN_32_CHARS}
      JwtSettings__Issuer: ${JWT_ISSUER:-FlowersAuth}
      JwtSettings__Audience: ${JWT_AUDIENCE:-FlowersApp}
    ports:
      - "5022:8080"
    networks:
      - flower_net_team2

  catalogservice:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-catalog-service-team2:latest
    build:
      context: .
      dockerfile: Catalog Service/Dockerfile
    container_name: flower_catalog_service_team2
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__CatalogServiceDb: "Server=sqlserver,1433;Database=${MSSQL_CATALOG_DB:-CatalogServiceDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_CATALOG_DB:-CatalogServiceDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
    ports:
      - "5129:8080"
    networks:
      - flower_net_team2

  cartservice:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-cart-service-team2:latest
    build:
      context: .
      dockerfile: Cart ServiceCart Service/Dockerfile
    container_name: flower_cart_service_team2
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5292:8080"
    networks:
      - flower_net_team2

  # ────────────────────────────────────────────────────────────────────────────
  # Order & Fulfillment Microservice
  # ────────────────────────────────────────────────────────────────────────────
  order-service:
    image: ${DOCKER_USERNAME:-hossammokhtar}/flower-order-service:latest
    build:
      context: .
      dockerfile: Services/Order & Fulfillment/Order & Fulfillment Service/Dockerfile
    container_name: flower_order_service
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      identity-api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FlowersOrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      CartService__BaseUrl: "http://cart-service:8080"
      AddressService__BaseUrl: "http://address-service:8080"
      PaymentService__BaseUrl: "http://payment-service:8080"
      IdentityService__BaseUrl: "http://identity-api:8080"
      JwtSettings__Secret: ${JWT_SECRET:-YOUR_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_MIN_32_CHARS}
      JwtSettings__Issuer: ${JWT_ISSUER:-FlowersAuth}
      JwtSettings__Audience: ${JWT_AUDIENCE:-FlowersApp}
    ports:
      - "5109:8080"
    networks:
      - flower_net_team2

  paymentservice:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-payment-service-team2:latest
    build:
      context: .
      dockerfile: Payment Service/Dockerfile
    container_name: flower_payment_service_team2
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FlowersPaymentDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Paymob__BaseUrl: ${PAYMOB_BASE_URL:-https://accept.paymob.com/api/}
      Paymob__ApiKey: ${PAYMOB_API_KEY:-}
      Paymob__SecretKey: ${PAYMOB_SECRET_KEY:-}
      Paymob__PublicKey: ${PAYMOB_PUBLIC_KEY:-}
      Paymob__HmacSecret: ${PAYMOB_HMAC_SECRET:-}
      Paymob__IntegrationId: ${PAYMOB_INTEGRATION_ID:-0}
    ports:
      - "5260:8080"
    networks:
      - flower_net_team2

  addressstorecoverageservice:
    image: ${DOCKER_USERNAME:-soloprogrammer88}/flower-address-service-team2:latest
    build:
      context: .
      dockerfile: Address & Store Coverage Service/Dockerfile
    container_name: flower_address_service_team2
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5272:8080"
    networks:
      - flower_net_team2

volumes:
  mssql_data_team2:
    driver: local
  seq_data_team2:
    driver: local

networks:
  flower_net_team2:
    driver: bridge
