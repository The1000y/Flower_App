name: flower_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  retrofit: ^4.9.0
  json_annotation: ^4.12.0
  dio: ^5.11.0
  injectable: ^3.0.0
  equatable: ^2.0.7
  get_it: ^9.2.1
  flutter_bloc: ^8.1.3
  flutter_screenutil_plus: ^1.6.0
  persistent_bottom_nav_bar_v2: ^6.3.2
  flutter_secure_storage: ^11.0.0
  google_fonts: ^8.2.0
  pinput: ^6.0.2
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  cached_network_image: ^4.0.0
  geocoding: ^4.0.0
  flutter_dotenv: ^6.0.1
  collection: ^1.19.0
  intl: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  injectable_generator: 3.0.2
  bloc_test: ^9.1.7
  mockito: ^5.5.0
  mocktail: ^1.0.5
  test: ^1.31.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/jsons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F9ECF0"
  adaptive_icon_foreground: "assets/splash_logo.png"

flutter_native_splash:
  color: "#F9ECF0"
  image: "assets/splash_logo.png"
  android: true
  ios: true
  android_12:
    image: "assets/splash_logo.png"
    icon_background_color: "#F9ECF0"