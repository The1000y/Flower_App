name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: $PR_TITLE"

          if [[ "$PR_TITLE" =~ ^(feat|fix|chore|refactor|test|docs|style|perf|build|ci|revert)(\([a-zA-Z0-9._-]+\))?:\ .+ ]]; then
            echo "✅ PR title follows the required convention."
          else
            echo "❌ Invalid PR title."
            echo ""
            echo "Expected format:"
            echo "  <type>: <description>"
            echo "  <type>(<scope>): <description>"
            echo ""
            echo "Allowed types:"
            echo "  feat      - New feature"
            echo "  fix       - Bug fix"
            echo "  chore     - Maintenance"
            echo "  refactor  - Code refactoring"
            echo "  test      - Tests"
            echo "  docs      - Documentation"
            echo "  style     - Style/formatting"
            echo "  perf      - Performance"
            echo "  build     - Build/dependencies"
            echo "  ci        - CI/CD changes"
            echo "  revert    - Revert a previous change"
            echo ""
            echo "Examples:"
            echo "  feat: add product details screen"
            echo "  fix: resolve login validation issue"
            echo "  chore: update dependencies"
            echo "  feat(auth): add refresh token support"
            exit 1
          fi